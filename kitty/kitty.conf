# 1. Tipografía
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# 2. Diseño de la Ventana (Minimalista)
window_padding_width 15
hide_window_decorations yes
tab_bar_edge bottom
tab_bar_style powerline

# 3. Colores (Morado Oscuro) y Transparencia
background #14111e
foreground #cdd6f4
selection_background #3c3856
background_opacity 0.85
dynamic_background_opacity yes

# 4. Animación y Cursor
cursor_shape beam
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
cursor_blink_interval 0.5 ease-in-out
cursor #00FFFF  # Descomenta esta línea para que tu cursor sea cian

# 5. Logo Transparente
window_logo_path /home/desaextremo/img/desaextremo_kitty_grande.png
window_logo_position bottom-right
window_logo_alpha 0.15
window_logo_scale 30

# 6. Utilidades
scrollback_lines 5000
enable_audio_bell no
