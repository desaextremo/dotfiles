format = """
[](#5C4033)\
$directory\
[](fg:#5C4033 bg:#36454F)\
$git_branch\
$git_status\
[](#36454F)\
$username\
$character
"""

[directory]
style = "fg:#EADDCA bg:#5C4033"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "fg:#A4B465 bg:#36454F"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "fg:#A4B465 bg:#36454F"
format = '[$all_status$ahead_behind ]($style)'

[username]
show_always = true
style_user = ""
style_root = "bg:#8B0000"
format = "[ 🦖 ]($style)"

[character]
success_symbol = "[ ❯](#A4B465)"
error_symbol = "[ ❯](bold red)"
